name: Apply WebOverlay core fixes

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply source changes
        shell: bash
        run: |
          if grep -q 'CORE_FIXES_V2' Program.cs; then
            echo 'Core fixes already integrated.'
            exit 0
          fi

          sed -i 's/private void SetContentVisible/public void SetContentVisible/' tools/apply_core_fixes.py
          python3 tools/apply_core_fixes.py
          grep -q 'CORE_FIXES_V2' Program.cs

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Program.cs
          git commit -m 'Integrate overlay fixes into core architecture'
          git push
