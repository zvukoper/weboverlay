name: Apply single screen quest command fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch Program.cs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          function Replace-Once([string]$Text, [string]$Pattern, [string]$Replacement, [string]$Name) {
              $new = [regex]::Replace($Text, $Pattern, $Replacement, [Text.RegularExpressions.RegexOptions]::Singleline)
              if ($new -eq $Text) { throw "Pattern not found: $Name" }
              return $new
          }

          $path = 'Program.cs'
          $text = Get-Content -Raw -Encoding UTF8 $path

          # Single-instance command parsing: allow a second invocation to close one URL window.
          $text = $text.Replace('                string url = null;`r`n                bool append = false;`r`n', '                string url = null;`r`n                bool append = false;`r`n                bool close = false;`r`n')
          $text = $text.Replace('                    if (arg.Equals("-append", StringComparison.OrdinalIgnoreCase) || arg.Equals("append", StringComparison.OrdinalIgnoreCase))`r`n', '                    if (arg.Equals("-append", StringComparison.OrdinalIgnoreCase) || arg.Equals("append", StringComparison.OrdinalIgnoreCase))`r`n')
          $text = $text.Replace('                        if (i + 1 < args.Length)`r`n                            url = args[++i];`r`n                    }`r`n                    else if (!arg.StartsWith("-"))`r`n', '                        if (i + 1 < args.Length)`r`n                            url = args[++i];`r`n                    }`r`n                    else if (arg.Equals("close", StringComparison.OrdinalIgnoreCase) || arg.Equals("-close", StringComparison.OrdinalIgnoreCase))`r`n                    {`r`n                        close = true;`r`n                        if (i + 1 < args.Length)`r`n                            url = args[++i];`r`n                    }`r`n                    else if (!arg.StartsWith("-"))`r`n')

          $text = $text.Replace('                if (!createdNew)`r`n                {`r`n                    if (!string.IsNullOrEmpty(url))`r`n                    {`r`n                        // Starting WebOverlay for another URL must never replace an existing HUD window.`r`n                        // The named-pipe command is append-only even when the caller omitted -append.`r`n                        SendCommandToExistingInstance("append|" + url);`r`n                    }`r`n                    return;`r`n                }`r`n', '                if (!createdNew)`r`n                {`r`n                    if (!string.IsNullOrEmpty(url))`r`n                    {`r`n                        SendCommandToExistingInstance((close ? "close|" : "append|") + url);`r`n                    }`r`n                    return;`r`n                }`r`n')

          # If a close request starts without an existing host, there is nothing to do.
          $marker = '                _appDataDir = Path.Combine(Environment.GetFolderPath(Environment.SpecialFolder.ApplicationData), "WebOverlay");'
          $text = $text.Replace($marker, '                if (close)`r`n                    return;`r`n`r`n' + $marker)

          # Add targeted URL close to WindowManager.
          $closeMethod = @'
        public static bool CloseWindowByUrl(string targetUrl)
        {
            if (string.IsNullOrWhiteSpace(targetUrl))
                return false;

            var window = _windows.FirstOrDefault(w => string.Equals(w.Url, targetUrl, StringComparison.OrdinalIgnoreCase));
            if (window == null || window.IsDisposed)
                return false;

            window.Close();
            return true;
        }

'@
          $text = $text.Replace('        public static void ToggleClickableActive()' + [Environment]::NewLine, $closeMethod + '        public static void ToggleClickableActive()' + [Environment]::NewLine)

          # Pipe server accepts append/close. Replace the command handling block only.
          $oldPipe = @'
                                if (command == "append")
                                {
                                    WindowManager.CreateWindow(pipeUrl, _config, _appDataDir, false);
                                }
                                else if (command == "replace")
                                {
                                    var active = WindowManager.ActiveWindow;
                                    if (active != null)
                                        active.NavigateToUrl(pipeUrl);
                                    else
                                        WindowManager.CreateWindow(pipeUrl, _config, _appDataDir, true);
                                }
'@
          $newPipe = @'
                                if (command == "append")
                                {
                                    WindowManager.CreateWindow(pipeUrl, _config, _appDataDir, false);
                                }
                                else if (command == "close")
                                {
                                    bool closed = WindowManager.CloseWindowByUrl(pipeUrl);
                                    Log($"Pipe close url={pipeUrl} closed={closed}");
                                }
'@
          if (-not $text.Contains($oldPipe)) { throw 'Pipe command block not found' }
          $text = $text.Replace($oldPipe, $newPipe)

          # Make each native window's title reflect its URL so diagnostics and OS window tools are useful.
          $text = $text.Replace('            FormBorderStyle = FormBorderStyle.None;`r`n            TopMost = true;', '            FormBorderStyle = FormBorderStyle.None;`r`n            Text = GetContentName();`r`n            TopMost = true;')
          $text = $text.Replace('            url = newUrl;`r`n            LoadState();', '            url = newUrl;`r`n            Text = GetContentName();`r`n            LoadState();')

          # Force screen-sized defaults for functional fullscreen layers; normal HUD defaults remain screen-sized and screen-relative.
          $oldApply = '(?s)        private void ApplyDefaultState\(\).*?\n        \}\n\n        private void SaveState\(\)'
          $newApply = @'
        private void ApplyDefaultState()
        {
            _zoomFactor = 1.0;

            var screen = Screen.PrimaryScreen ?? Screen.AllScreens.FirstOrDefault();
            if (screen == null)
            {
                Size = new Size(800, 600);
                Location = new Point(100, 100);
                Log($"ApplyDefaultState: no screen, fallback 800x600 at 100,100 for {url}");
                return;
            }

            var area = screen.Bounds;
            string normalizedUrl = (url ?? string.Empty).ToLowerInvariant();

            if (normalizedUrl.Contains("web_ar_hud.html") ||
                normalizedUrl.Contains("web_quests.html") ||
                normalizedUrl.Contains("web_notifications.html"))
            {
                Size = new Size(area.Width, area.Height);
                Location = new Point(area.Left, area.Top);
            }
            else if (normalizedUrl.Contains("web_pda_map.html"))
            {
                int side = Math.Max(100, (int)Math.Round(area.Height * 0.30));
                side = Math.Min(side, Math.Min(area.Width, area.Height));
                Size = new Size(side, side);
                Location = new Point(area.Left, area.Bottom - side);
            }
            else if (normalizedUrl.Contains("web_ui_hybrid.html"))
            {
                int width = Math.Max(100, (int)Math.Round(area.Width * 0.42));
                int height = Math.Max(100, (int)Math.Round(area.Height * 0.32));
                width = Math.Min(width, area.Width);
                height = Math.Min(height, area.Height);
                Size = new Size(width, height);
                Location = new Point(area.Left + (area.Width - width) / 2, area.Bottom - height);
            }
            else if (normalizedUrl.Contains("web_pause_logo.html"))
            {
                int side = Math.Max(100, (int)Math.Round(area.Height * 0.18));
                side = Math.Min(side, Math.Min(area.Width, area.Height));
                Size = new Size(side, side);
                Location = new Point(area.Right - side, area.Top);
            }
            else if (normalizedUrl.Contains("web_heights.html"))
            {
                int width = Math.Max(100, (int)Math.Round(area.Width * 0.34));
                int height = Math.Max(100, (int)Math.Round(area.Height * 0.30));
                width = Math.Min(width, area.Width);
                height = Math.Min(height, area.Height);
                Size = new Size(width, height);
                Location = new Point(area.Right - width, area.Top);
            }
            else if (normalizedUrl.Contains("help.html"))
            {
                Size = new Size(800, 1000);
                int x = Math.Min(area.Right - Width, area.Left + 560);
                int y = area.Top + 15;
                Location = new Point(Math.Max(area.Left, x), Math.Max(area.Top, y));
            }
            else
            {
                Size = new Size(800, 600);
                int x = area.Left + Math.Max(0, (area.Width - Width) / 2);
                int y = area.Top + Math.Max(0, (area.Height - Height) / 2);
                Location = new Point(Math.Max(area.Left, x), Math.Max(area.Top, y));
            }

            if (webView != null)
                webView.ZoomFactor = _zoomFactor;

            Log($"ApplyDefaultState: url={url}, location={Location.X},{Location.Y}, size={Width}x{Height}");
        }

        private void SaveState()
'@
          $text = Replace-Once $text $oldApply $newApply 'single-screen default geometry'

          # Remove legacy per-monitor state support completely. Existing legacy files are no longer read.
          $text = Replace-Once $text '(?s)        private string GetLegacyMonitorStateFilePath\(\).*?        private static string GetSafeFilePart' '        private static string GetSafeFilePart' 'remove monitor state helpers'
          $text = Replace-Once $text '(?s)        private static string GetSafeFilePart\(string value\)\s*\{.*?        private void LoadState\(\)' @'
        private static string GetSafeFilePart(string value)
        {
            string safe = string.Join("_", value.Split(Path.GetInvalidFileNameChars()));
            if (safe.Length > 180)
                safe = safe[..180];
            return safe;
        }

        private void LoadState()
'@ 'single state helpers'

          $oldLoad = @'
                if (!TryLoadStateFile(GetStateFilePath()))
                {
                    string legacy = GetLegacyMonitorStateFilePath();
                    if (!string.IsNullOrEmpty(legacy) && TryLoadStateFile(legacy))
                    {
                        SaveState();
                        Log($"LoadState: migrated legacy monitor state {legacy} -> {GetStateFilePath()}");
                    }
                    else
                    {
                        ApplyDefaultState();
                        SaveState();
                    }
                }
'@
          $newLoad = @'
                if (!TryLoadStateFile(GetStateFilePath()))
                {
                    ApplyDefaultState();
                    SaveState();
                }
'@
          if (-not $text.Contains($oldLoad)) { throw 'LoadState monitor migration block not found' }
          $text = $text.Replace($oldLoad, $newLoad)

          # URL-specific clickability: quest dialog is clickable only while paused; notifications and AR remain click-through.
          $oldApplyClick = @'
        private void ApplyClickability()
        {
            Enabled = true;
            SetClickThrough(!_clickable);
        }
'@
          $newApplyClick = @'
        private void ApplyClickability()
        {
            Enabled = true;
            SetClickThrough(!_clickable);
        }

        public void SetNativeClickability(bool clickable)
        {
            if (url != null && url.Contains("web_quests.html", StringComparison.OrdinalIgnoreCase))
                _clickable = clickable;
            else if (url != null && url.Contains("web_notifications.html", StringComparison.OrdinalIgnoreCase))
                _clickable = false;
            else
                _clickable = clickable;

            SetClickThrough(!_clickable);
            UpdateManipulationInfo();
        }
'@
          if (-not $text.Contains($oldApplyClick)) { throw 'ApplyClickability block not found' }
          $text = $text.Replace($oldApplyClick, $newApplyClick)

          # Initialize special layers as click-through; quest page will enable input on pause through web message.
          $text = $text.Replace('            _clickable = config.Clickable;`r`n', '            _clickable = IsSpecialClickThroughUrl(url) ? false : config.Clickable;`r`n')
          $specialHelper = @'
        private static bool IsSpecialClickThroughUrl(string value)
        {
            if (string.IsNullOrWhiteSpace(value)) return false;
            return value.Contains("web_quests.html", StringComparison.OrdinalIgnoreCase) ||
                   value.Contains("web_notifications.html", StringComparison.OrdinalIgnoreCase) ||
                   value.Contains("web_ar_hud.html", StringComparison.OrdinalIgnoreCase);
        }

'@
          $text = $text.Replace('        private void Log(string msg)' + [Environment]::NewLine, $specialHelper + '        private void Log(string msg)' + [Environment]::NewLine)

          # Handle JSON messages from web pages (quest pause controls native click-through).
          $oldWebMsg = @'
                        if (e.TryGetWebMessageAsString() == "toggle")
                            WindowManager.ToggleLockMode();
'@
          $newWebMsg = @'
                        string message = e.TryGetWebMessageAsString();
                        if (message == "toggle")
                        {
                            WindowManager.ToggleLockMode();
                            return;
                        }

                        if (!string.IsNullOrWhiteSpace(message) && message.StartsWith("{"))
                        {
                            var payload = JsonSerializer.Deserialize<Dictionary<string, JsonElement>>(message);
                            if (payload != null && payload.TryGetValue("command", out var command) &&
                                string.Equals(command.GetString(), "set_clickable", StringComparison.OrdinalIgnoreCase) &&
                                payload.TryGetValue("value", out var value))
                            {
                                SetNativeClickability(value.GetBoolean());
                            }
                        }
'@
          if (-not $text.Contains($oldWebMsg)) { throw 'WebMessageReceived block not found' }
          $text = $text.Replace($oldWebMsg, $newWebMsg)

          Set-Content -Path $path -Value $text -Encoding UTF8

          # Validate no multi-monitor state/runtime code remains and command path exists.
          $verify = Get-Content -Raw -Encoding UTF8 Program.cs
          if ($verify -match 'MoveToNextMonitor|GetMonitorKey|__monitor_') { throw 'Multi-monitor runtime/state support remains' }
          if ($verify -notmatch 'close\|' -or $verify -notmatch 'CloseWindowByUrl') { throw 'Close window command missing' }
          if ($verify -notmatch 'web_quests\.html.*web_notifications\.html') { Write-Host 'Fullscreen URLs are supplied by Assist; WebOverlay default matcher still present.' }

      - name: Build and publish
        shell: pwsh
        run: dotnet publish WebOverlay.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:PublishTrimmed=false -o obj\ci-publish --nologo

      - name: Commit source fix and remove workflow
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Program.cs .github/workflows/apply-single-screen-quest-command-fix.yml
          git commit -m 'Fix fullscreen quest windows and URL-specific close command'
          git push
          git rm .github/workflows/apply-single-screen-quest-command-fix.yml
          git commit -m 'Remove temporary quest overlay migration workflow'
          git push
