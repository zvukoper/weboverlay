name: WebOverlay CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build and publish
    runs-on: windows-latest
    env:
      CI: true
      DOTNET_NOLOGO: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: WebOverlay.csproj

      - name: Patch single-monitor source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          function Remove-BlockBetween([string]$Text, [string]$StartMarker, [string]$EndMarker, [string]$Name) {
              $start = $Text.IndexOf($StartMarker, [StringComparison]::Ordinal)
              if ($start -lt 0) { throw "Start marker not found: $Name" }
              $end = $Text.IndexOf($EndMarker, $start, [StringComparison]::Ordinal)
              if ($end -lt 0) { throw "End marker not found: $Name" }
              return $Text.Substring(0, $start) + $Text.Substring($end)
          }

          $path = 'Program.cs'
          $text = Get-Content -Raw -Encoding UTF8 $path

          $text = $text.Replace('        public string MoveMonitor { get; set; } = "Ctrl+Shift+Alt+Oem5";' + [Environment]::NewLine, '')
          $text = Remove-BlockBetween $text '        public static void MoveActiveToNextMonitor()' '        public static void ToggleLockMode()' 'WindowManager monitor command'

          $oldSecondInstance = @'
                if (!createdNew)
                {
                    if (!string.IsNullOrEmpty(url))
                    {
                        SendCommandToExistingInstance((append ? "append" : "replace") + "|" + url);
                    }
                    return;
                }
'@
          $newSecondInstance = @'
                if (!createdNew)
                {
                    if (!string.IsNullOrEmpty(url))
                    {
                        // A second launch must always create another overlay window.
                        // Never replace/navigate an already visible HUD window.
                        SendCommandToExistingInstance("append|" + url);
                    }
                    return;
                }
'@
          if ($text.Contains($oldSecondInstance)) {
              $text = $text.Replace($oldSecondInstance, $newSecondInstance)
          } elseif ($text -notmatch 'SendCommandToExistingInstance\("append\|" \+ url\)') {
              throw 'Second-instance startup block not found'
          }

          $oldPipe = @'
                        string command = parts[0];
                        string pipeUrl = parts[1];
                        _firstWindow.Invoke(new Action(() =>
                        {
                            try
                            {
                                if (command == "append")
                                {
                                    WindowManager.CreateWindow(pipeUrl, _config, _appDataDir, false);
                                }
                                else if (command == "replace")
                                {
                                    var active = WindowManager.ActiveWindow;
                                    if (active != null)
                                        active.NavigateToUrl(pipeUrl);
                                    else
                                        WindowManager.CreateWindow(pipeUrl, _config, _appDataDir, true);
                                }
                            }
                            catch (Exception ex)
                            {
                                Log($"Ошибка команды pipe: {ex.Message}");
                            }
                        }));
'@
          $newPipe = @'
                        string pipeUrl = parts[1];
                        _firstWindow.Invoke(new Action(() =>
                        {
                            try
                            {
                                // All external launches create independent overlay windows.
                                // A new URL must never replace an existing HUD.
                                WindowManager.CreateWindow(pipeUrl, _config, _appDataDir, false);
                            }
                            catch (Exception ex)
                            {
                                Log($"Ошибка команды pipe: {ex.Message}");
                            }
                        }));
'@
          if ($text.Contains($oldPipe)) {
              $text = $text.Replace($oldPipe, $newPipe)
          } elseif ($text -notmatch 'All external launches create independent overlay windows') {
              throw 'Pipe window command block not found'
          }

          $text = $text.Replace('        private bool _monitorHotkeyArmed;' + [Environment]::NewLine, '')
          $text = $text.Replace('        private Keys _monitorHotkeyKey = Keys.None;' + [Environment]::NewLine, '')
          $text = $text.Replace('            KeyUp += OnKeyUp;' + [Environment]::NewLine, '')
          $text = $text.Replace('            webView.KeyUp += (s, e) => OnKeyUp(s, e);' + [Environment]::NewLine, '')
          $text = $text.Replace('            // Monitor hotkey: arm on press, execute once on release.' + [Environment]::NewLine + '            if (TryArmMonitorHotkey(e))' + [Environment]::NewLine + '                return;' + [Environment]::NewLine + [Environment]::NewLine, '')

          $text = Remove-BlockBetween $text '        public void MoveToNextMonitor()' '        public void UpdateManipulationInfo()' 'OverlayForm monitor movement'
          $text = Remove-BlockBetween $text '        private void OnKeyUp(object sender, KeyEventArgs e)' '        private bool TryArmMonitorHotkey(KeyEventArgs e)' 'OverlayForm key release handler'
          $text = Remove-BlockBetween $text '        private bool TryArmMonitorHotkey(KeyEventArgs e)' '        private static bool MatchesMovementBinding' 'OverlayForm monitor hotkey'

          $start = $text.IndexOf('        public void UpdateManipulationInfo()', [StringComparison]::Ordinal)
          $end = $text.IndexOf('        private string GetContentName()', $start, [StringComparison]::Ordinal)
          if ($start -lt 0 -or $end -lt 0) { throw 'UpdateManipulationInfo markers not found' }
          $newInfo = @'
        public void UpdateManipulationInfo()
        {
            if (!_manipulationMode || _infoForm == null || _infoForm.IsDisposed)
                return;

            string title = GetContentName();
            string text = $"{title} | {Width}x{Height} | zoom {_zoomFactor * 100:0}% | X:{Left} Y:{Top} | bounds {Left},{Top}-{Right},{Bottom} | click {( _clickable ? "ON" : "OFF" )}";
            _infoForm.UpdateFor(this, text);
        }

'@
          $text = $text.Substring(0, $start) + $newInfo + $text.Substring($end)

          $stateStart = $text.IndexOf('        private string GetStateFilePath()', [StringComparison]::Ordinal)
          $stateEnd = $text.IndexOf('        protected override void WndProc(ref Message m)', $stateStart, [StringComparison]::Ordinal)
          if ($stateStart -lt 0 -or $stateEnd -lt 0) { throw 'State storage markers not found' }

          $stateBlock = @'
        private string GetStateFilePath()
        {
            string safe = GetSafeFilePart(url ?? "WebOverlay");
            return Path.Combine(configDir, safe + ".txt");
        }

        private string GetLegacyMonitorStateFilePath()
        {
            string safe = GetSafeFilePart(url ?? "WebOverlay");
            try
            {
                Screen current = Screen.FromHandle(Handle);
                string monitorKey = GetMonitorKey(current);
                string preferred = Path.Combine(configDir, safe + "__monitor_" + monitorKey + ".txt");
                if (File.Exists(preferred))
                    return preferred;
            }
            catch { }

            try
            {
                return Directory.GetFiles(configDir, safe + "__monitor_*.txt")
                    .OrderBy(path => path, StringComparer.OrdinalIgnoreCase)
                    .FirstOrDefault();
            }
            catch
            {
                return null;
            }
        }

        private static string GetSafeFilePart(string value)
        {
            string safe = string.Join("_", value.Split(Path.GetInvalidFileNameChars()));
            if (safe.Length > 180)
                safe = safe[..180];
            return safe;
        }

        private static string GetMonitorKey(Screen monitor)
        {
            string name = monitor?.DeviceName ?? "PRIMARY";
            var chars = name.Where(char.IsLetterOrDigit).ToArray();
            return chars.Length == 0 ? "PRIMARY" : new string(chars);
        }

        private void LoadState()
        {
            _stateApplying = true;
            try
            {
                if (!TryLoadStateFile(GetStateFilePath()))
                {
                    string legacy = GetLegacyMonitorStateFilePath();
                    if (!string.IsNullOrEmpty(legacy) && TryLoadStateFile(legacy))
                    {
                        SaveState();
                        Log($"LoadState: migrated legacy monitor state {legacy} -> {GetStateFilePath()}");
                    }
                    else
                    {
                        ApplyDefaultState();
                        SaveState();
                    }
                }
            }
            finally
            {
                _stateApplying = false;
                _stateDirty = false;
            }
        }

        private bool TryLoadStateFile(string path)
        {
            if (!File.Exists(path))
                return false;

            try
            {
                string[] lines = File.ReadAllLines(path, Encoding.UTF8);
                if (lines.Length < 5)
                    return false;

                int x = int.Parse(lines[0]);
                int y = int.Parse(lines[1]);
                double zoom = double.Parse(lines[2], System.Globalization.CultureInfo.InvariantCulture);
                int w = int.Parse(lines[3]);
                int h = int.Parse(lines[4]);

                Location = new Point(x, y);
                _zoomFactor = Math.Clamp(zoom, 0.3, 3.0);
                Size = new Size(Math.Max(100, w), Math.Max(100, h));
                if (webView != null)
                    webView.ZoomFactor = _zoomFactor;
                return true;
            }
            catch (Exception ex)
            {
                Log($"LoadState ошибка: {ex.Message}");
                return false;
            }
        }

        private void ApplyDefaultState()
        {
            _zoomFactor = 1.0;

            var screen = Screen.PrimaryScreen;
            if (screen == null)
            {
                Size = new Size(800, 600);
                Location = new Point(100, 100);
                Log($"ApplyDefaultState: no primary screen, fallback 800x600 at 100,100 for {url}");
                return;
            }

            var area = screen.WorkingArea;
            string normalizedUrl = (url ?? string.Empty).ToLowerInvariant();

            if (normalizedUrl.Contains("help.html"))
            {
                Size = new Size(800, 1000);
                int x = Math.Min(area.Right - Width, area.Left + 560);
                int y = area.Top + 15;
                Location = new Point(Math.Max(area.Left, x), Math.Max(area.Top, y));
            }
            else if (normalizedUrl.Contains("web_pda_map.html"))
            {
                int side = Math.Max(100, (int)Math.Round(area.Height * 0.30));
                side = Math.Min(side, Math.Min(area.Width, area.Height));
                Size = new Size(side, side);
                Location = new Point(area.Left, area.Bottom - side);
            }
            else if (normalizedUrl.Contains("web_ui_hybrid.html"))
            {
                int width = Math.Max(100, (int)Math.Round(area.Width * 0.42));
                int height = Math.Max(100, (int)Math.Round(area.Height * 0.32));
                width = Math.Min(width, area.Width);
                height = Math.Min(height, area.Height);
                int x = area.Left + (area.Width - width) / 2;
                int y = area.Bottom - height;
                Size = new Size(width, height);
                Location = new Point(x, y);
            }
            else if (normalizedUrl.Contains("web_pause_logo.html"))
            {
                int side = Math.Max(100, (int)Math.Round(area.Height * 0.18));
                side = Math.Min(side, Math.Min(area.Width, area.Height));
                Size = new Size(side, side);
                Location = new Point(area.Right - side, area.Top);
            }
            else if (normalizedUrl.Contains("web_heights.html"))
            {
                int width = Math.Max(100, (int)Math.Round(area.Width * 0.34));
                int height = Math.Max(100, (int)Math.Round(area.Height * 0.30));
                width = Math.Min(width, area.Width);
                height = Math.Min(height, area.Height);
                Size = new Size(width, height);
                Location = new Point(area.Right - width, area.Top);
            }
            else
            {
                Size = new Size(800, 600);
                int x = area.Left + Math.Max(0, (area.Width - Width) / 2);
                int y = area.Top + Math.Max(0, (area.Height - Height) / 2);
                Location = new Point(Math.Max(area.Left, x), Math.Max(area.Top, y));
            }

            if (webView != null)
                webView.ZoomFactor = _zoomFactor;

            Log($"ApplyDefaultState: url={url}, location={Location.X},{Location.Y}, size={Width}x{Height}");
        }

        private void SaveState()
        {
            try
            {
                Directory.CreateDirectory(configDir);
                File.WriteAllLines(GetStateFilePath(), new[]
                {
                    Location.X.ToString(),
                    Location.Y.ToString(),
                    _zoomFactor.ToString(System.Globalization.CultureInfo.InvariantCulture),
                    Width.ToString(),
                    Height.ToString()
                }, Encoding.UTF8);
            }
            catch (Exception ex)
            {
                Log($"SaveState ошибка: {ex.Message}");
            }
        }

'@
          $text = $text.Substring(0, $stateStart) + $stateBlock + $text.Substring($stateEnd)

          $helpPath = 'HelpPage.cs'
          $help = Get-Content -Raw -Encoding UTF8 $helpPath
          $help = $help.Replace('        string monitor = config.MoveMonitor;' + [Environment]::NewLine, '')
          $help = $help.Replace('        <li><kbd>{monitor}</kbd> — {Localization.Get("MoveMonitorDesc", "move active window to next monitor")}</li>' + [Environment]::NewLine, '')
          $help = $help.Replace('        <li><kbd>{monitor}</kbd> — {Localization.Get("MoveMonitorDesc", "move active window to next monitor")}</li>', '')

          Set-Content -Path $path -Value $text -Encoding UTF8
          Set-Content -Path $helpPath -Value $help -Encoding UTF8

      - name: Validate source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $program = Get-Content -Raw -Encoding UTF8 Program.cs
          $help = Get-Content -Raw -Encoding UTF8 HelpPage.cs
          if ($program -match 'MoveMonitor|MoveToNextMonitor|_monitorHotkeyArmed|_monitorHotkeyKey') { throw 'Multi-monitor control remains in Program.cs' }
          if ($program -match 'GetStateFilePath\(Screen monitor\)|SaveStateForMonitor|LoadStateForMonitor') { throw 'Per-monitor state methods remain' }
          if ($help -match 'MoveMonitor|MoveMonitorDesc') { throw 'Monitor hotkey remains in HelpPage.cs' }
          if ($program -notmatch 'SendCommandToExistingInstance\("append\|" \+ url\)') { throw 'Second instance is not append-only' }
          if ($program -notmatch 'All external launches create independent overlay windows') { throw 'Pipe handler is not append-only' }
          if ($program -notmatch 'web_pda_map\.html' -or $program -notmatch 'web_ui_hybrid\.html' -or $program -notmatch 'web_pause_logo\.html') { throw 'URL defaults missing' }

      - name: Commit source changes
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Program.cs HelpPage.cs
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
              Write-Host 'Single-monitor source already applied.'
          } else {
              git commit -m 'Simplify WebOverlay to single monitor and preserve overlay windows'
              git push origin HEAD:main
          }

      - name: Restore
        run: dotnet restore WebOverlay.csproj

      - name: Build
        run: dotnet build WebOverlay.csproj --configuration Release --no-restore --nologo

      - name: Publish
        run: >-
          dotnet publish WebOverlay.csproj
          --configuration Release
          --no-restore
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:PublishTrimmed=false
          -o ./ci-publish

      - name: Verify published executable
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'ci-publish\WebOverlay.exe'
          if (-not (Test-Path $exe)) {
            Write-Error "Published executable was not created: $exe"
            exit 1
          }
          $item = Get-Item $exe
          Write-Host "Published: $($item.FullName)"
          Write-Host "Size: $($item.Length) bytes"
          if ($item.Length -lt 1000000) {
            Write-Error "Published executable looks unexpectedly small."
            exit 1
          }

      - name: Upload published artifact
        uses: actions/upload-artifact@v4
        with:
          name: WebOverlay-win-x64
          path: ci-publish/WebOverlay.exe
          if-no-files-found: error
          retention-days: 14
