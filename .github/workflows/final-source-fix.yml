name: Final source fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch Program.cs
        shell: python
        run: |
          from pathlib import Path
          p = Path('Program.cs')
          s = p.read_text(encoding='utf-8-sig')
          if 'private static extern short GetAsyncKeyState' not in s:
              needle = '        private static extern bool UnregisterHotKey(IntPtr hWnd, int id);\n'
              if needle not in s:
                  raise SystemExit('UnregisterHotKey declaration not found')
              s = s.replace(needle, needle + '        [DllImport("user32.dll")]\n        private static extern short GetAsyncKeyState(int vKey);\n', 1)
          p.write_text(s, encoding='utf-8-sig')

          for rel in ['.github/workflows/final-source-fix.yml']:
              q = Path(rel)
              if q.exists():
                  q.unlink()
      - name: Validate
        run: grep -q 'private static extern short GetAsyncKeyState' Program.cs
      - name: Commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add native key state declaration to core'
          git push
