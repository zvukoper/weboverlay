name: Finalize WebOverlay core integration

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Finalize Program.cs
        shell: python
        run: |
          from pathlib import Path
          p = Path('Program.cs')
          s = p.read_text(encoding='utf-8-sig')

          # Remove migration marker from the final source.
          s = s.replace('// CORE_FIXES_V2\n', '', 1)

          # Remove the obsolete duplicate legacy SaveState() that remained after the direct migration.
          new_save = '''        private void SaveState()\n        {\n            try\n            {\n                Screen monitor;\n                try { monitor = Screen.FromHandle(Handle); }\n                catch { monitor = Screen.PrimaryScreen ?? Screen.AllScreens.FirstOrDefault(); }\n                SaveStateForMonitor(monitor);\n            }\n            catch (Exception ex)\n            {\n                Log($"SaveState ошибка: {ex.Message}");\n            }\n        }'''
          legacy_save = '''        private void SaveState()\n        {\n            try\n            {\n                File.WriteAllLines(GetStateFilePath(), new[]\n                {\n                    Location.X.ToString(),\n                    Location.Y.ToString(),\n                    _zoomFactor.ToString(System.Globalization.CultureInfo.InvariantCulture),\n                    Width.ToString(),\n                    Height.ToString()\n                });\n            }\n            catch (Exception ex)\n            {\n                Log($"SaveState ошибка: {ex.Message}");\n            }\n        }'''
          if legacy_save not in s:
              raise SystemExit('Expected obsolete SaveState block not found')
          s = s.replace('\n' + legacy_save, '', 1)

          # Add GetAsyncKeyState declaration if it is not already present.
          needle = '''        [DllImport("user32.dll")]\n        private static extern bool UnregisterHotKey(IntPtr hWnd, int id);\n'''
          addition = needle + '''        [DllImport("user32.dll")]\n        private static extern short GetAsyncKeyState(int vKey);\n'''
          if 'private static extern short GetAsyncKeyState' not in s:
              if needle not in s:
                  raise SystemExit('WinAPI declaration anchor not found')
              s = s.replace(needle, addition, 1)

          if s.count('private void SaveState()') != 1:
              raise SystemExit('Program.cs must contain exactly one SaveState() method')
          if 'GetAsyncKeyState' not in s:
              raise SystemExit('GetAsyncKeyState declaration missing')
          p.write_text(s, encoding='utf-8-sig')

          # Remove all temporary migration artifacts from the final repository.
          for f in [
              Path('.github/workflows/apply-core-fixes.yml'),
              Path('.github/workflows/apply-core-fixes2.yml'),
              Path('.github/workflows/finalize-core.yml'),
              Path('tools/apply_core_fixes.py'),
          ]:
              if f.exists():
                  f.unlink()
      - name: Validate
        run: |
          grep -q 'private static extern short GetAsyncKeyState' Program.cs
          test "$(grep -c 'private void SaveState()' Program.cs)" -eq 1
          test ! -e RuntimeFixes.cs
          test ! -e RuntimeOverrides.cs
          test ! -e tools/apply_core_fixes.py
          test ! -e .github/workflows/apply-core-fixes.yml
          test ! -e .github/workflows/apply-core-fixes2.yml

      - name: Commit final source
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Finalize core architecture fixes'
          git push
