name: Fix core source

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch Program.cs
        shell: pwsh
        run: |
          $path = 'Program.cs'
          $text = Get-Content $path -Raw -Encoding UTF8

          if ($text -notmatch 'private static extern short GetAsyncKeyState\(int vKey\);') {
            $needle = "        [DllImport(\"user32.dll\")]`r`n        private static extern bool UnregisterHotKey(IntPtr hWnd, int id);"
            $replacement = $needle + "`r`n        [DllImport(\"user32.dll\")]`r`n        private static extern short GetAsyncKeyState(int vKey);"
            $idx = $text.IndexOf('        private const short KEY_DOWN_MASK =')
            if ($idx -lt 0) { throw 'KEY_DOWN_MASK anchor not found' }
            $before = $text.Substring(0, $idx)
            $after = $text.Substring($idx)
            $local = $before.LastIndexOf('        [DllImport("user32.dll")]')
            $blockStart = $before.LastIndexOf("`n", $local)
            $block = $before.Substring($blockStart + 1)
            if ($block -notmatch 'UnregisterHotKey') { throw 'Overlay UnregisterHotKey anchor not found' }
            $before = $before.Substring(0, $blockStart + 1) + $replacement + "`r`n"
            $text = $before + $after
          }

          $text = $text.Replace('if (IsBindingHeld(_config.MoveLeft)) dx -= 2;', 'if (IsBindingHeld(_config.MoveLeft)) dx -= 1;')
          $text = $text.Replace('if (IsBindingHeld(_config.MoveRight)) dx += 2;', 'if (IsBindingHeld(_config.MoveRight)) dx += 1;')
          $text = $text.Replace('if (IsBindingHeld(_config.MoveUp)) dy -= 2;', 'if (IsBindingHeld(_config.MoveUp)) dy -= 1;')
          $text = $text.Replace('if (IsBindingHeld(_config.MoveDown)) dy += 2;', 'if (IsBindingHeld(_config.MoveDown)) dy += 1;')
          $text = $text.Replace('BackColor = Color.Black;`r`n                Opacity = 0.25;', 'BackColor = Color.Black;`r`n                Opacity = 0.15;')

          Set-Content $path -Value $text -Encoding UTF8

      - name: Validate source
        shell: pwsh
        run: |
          $text = Get-Content Program.cs -Raw -Encoding UTF8
          if ($text -notmatch 'private static extern short GetAsyncKeyState\(int vKey\);') { throw 'GetAsyncKeyState declaration missing' }
          if ($text -match 'if \(IsBindingHeld\(_config\.MoveLeft\)\) dx -= 2;') { throw '2px movement remains' }
          if ($text -match 'Opacity = 0\.25;') { throw '25% signature opacity remains' }

      - name: Commit
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Program.cs
          git commit -m 'Fix core overlay input and signature opacity'
          git push

      - name: Remove migration workflow
        shell: pwsh
        run: |
          git rm .github/workflows/fix-core-source.yml
          git commit -m 'Remove temporary source fix workflow'
          git push
