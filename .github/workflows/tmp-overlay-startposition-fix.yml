name: One-time WebOverlay OverlayForm start position fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, 'AUTO-FIX OVERLAY STARTPOSITION') && !contains(github.event.head_commit.message, 'Remove temporary OverlayForm start position workflow') }}
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
          cache: false
      - name: Restore
        shell: pwsh
        run: dotnet restore WebOverlay.csproj
      - name: Patch OverlayForm only
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = 'Program.cs'
          $text = [IO.File]::ReadAllText($path, [Text.Encoding]::UTF8)
          $already = '(?s)private void InitializeForm\(\)\s*\{\s*FormBorderStyle\s*=\s*FormBorderStyle\.None;\s*StartPosition\s*=\s*FormStartPosition\.Manual;'
          if ([regex]::IsMatch($text, $already)) {
              Write-Host 'OverlayForm.InitializeForm already has StartPosition=Manual.'
          } else {
              $pattern = '(?s)(private void InitializeForm\(\)\s*\{\s*FormBorderStyle\s*=\s*FormBorderStyle\.None;)'
              if (-not [regex]::IsMatch($text, $pattern)) { throw 'OverlayForm.InitializeForm/FormBorderStyle marker not found.' }
              $replacement = '$1' + [Environment]::NewLine + '            StartPosition = FormStartPosition.Manual;'
              $text = [regex]::Replace($text, $pattern, $replacement, 1)
              [IO.File]::WriteAllText($path, $text, [Text.UTF8Encoding]::new($true))
          }
          $verify = '(?s)private void InitializeForm\(\)\s*\{\s*FormBorderStyle\s*=\s*FormBorderStyle\.None;\s*StartPosition\s*=\s*FormStartPosition\.Manual;'
          if (-not [regex]::IsMatch($text, $verify)) { throw 'OverlayForm.InitializeForm still does not contain StartPosition=Manual.' }
          git diff --check
          git diff -- Program.cs
      - name: Build
        shell: pwsh
        run: dotnet build WebOverlay.csproj --configuration Release --no-restore
      - name: Commit and remove workflow
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Program.cs
          git commit -m 'AUTO-FIX OVERLAY STARTPOSITION: honor overlay coordinates'
          git rm .github/workflows/tmp-overlay-startposition-fix.yml
          git commit -m 'Remove temporary OverlayForm start position workflow'
          git push
