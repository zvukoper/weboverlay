name: One-time legacy overlay config migration

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          cache: false

      - name: Patch and build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = 'Program.cs'
          $text = [IO.File]::ReadAllText($path, [Text.Encoding]::UTF8)

          $needle = @'
                int h = int.Parse(lines[4]);

                Location = new Point(x, y);
'@
          $replacement = @'
                int h = int.Parse(lines[4]);

                // These exact coordinates are obsolete centered/offset defaults from the
                // previous WebOverlay host. Treat them as missing so current URL-specific
                // defaults are applied once and persisted.
                if (IsLegacyDefaultState(x, y, w, h))
                {
                    Log($"TryLoadStateFile: ignoring legacy default for {url}: X={x}, Y={y}, size={w}x{h}");
                    return false;
                }

                Location = new Point(x, y);
'@

          $marker = @'
        private void ApplyDefaultState()
        {
'@
          $helper = @'
        private bool IsLegacyDefaultState(int x, int y, int w, int h)
        {
            string normalized = (url ?? string.Empty).ToLowerInvariant();
            return
                (normalized.Contains("web_pda_map.html") && x == 130 && y == 130 && w == 331 && h == 331) ||
                (normalized.Contains("web_ui_hybrid.html") && x == 208 && y == 208 && w == 859 && h == 465) ||
                (normalized.Contains("web_pause_logo.html") && x == 156 && y == 156 && w == 207 && h == 207) ||
                (normalized.Contains("web_heights.html") && x == 1267 && y == 0 && w == 653 && h == 312);
        }

'@

          if (-not $text.Contains('IsLegacyDefaultState(int x, int y, int w, int h)')) {
              if (-not $text.Contains($needle)) { throw 'TryLoadStateFile insertion marker not found.' }
              if (-not $text.Contains($marker)) { throw 'ApplyDefaultState marker not found.' }
              $text = $text.Replace($needle, $replacement)
              $text = $text.Replace($marker, $helper + $marker)
              [IO.File]::WriteAllText($path, $text, [Text.UTF8Encoding]::new($true))
          }

          git diff --check
          dotnet restore WebOverlay.csproj
          dotnet build WebOverlay.csproj --configuration Release --no-restore --nologo

      - name: Apply one-time commit
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Program.cs
          git rm .github/workflows/tmp-state-config-fix.yml
          git diff --cached --check
          git commit -m 'Fix legacy WebOverlay default positions'
          git push